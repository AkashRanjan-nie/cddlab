name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: myapp,     context: exp09-dockerfile-node }
          - { name: webapp,    context: exp10-docker-compose/app }
          - { name: javaapp,   context: exp11-docker-java }
          - { name: pythonapp, context: exp11-docker-python }
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image
        run: docker build -t ${{ matrix.name }}:ci ${{ matrix.context }}
      - name: Run ${{ matrix.name }} (smoke test for the simple apps)
        if: matrix.name == 'javaapp' || matrix.name == 'pythonapp'
        run: docker run --rm ${{ matrix.name }}:ci
